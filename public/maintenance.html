<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>قيد الصيانة</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #f1f5f9;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      }
      .icon {
        font-size: 3.5rem;
        margin-bottom: 16px;
        animation: float 2.5s ease-in-out infinite;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 12px;
        font-weight: 700;
        color: #fff;
      }
      p {
        max-width: 320px;
        line-height: 1.7;
        color: #94a3b8;
        font-size: 0.95rem;
      }
      .badge {
        margin-top: 20px;
        padding: 6px 16px;
        border: 1px solid #334155;
        border-radius: 999px;
        font-size: 0.8rem;
        color: #64748b;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
    </style>
  </head>
  <body>
    <div class="icon">🚧</div>
    <h1>الموقع قيد الصيانة</h1>
    <p>
      عم نشتغل حالياً على تحسين تجربة الموقع على الهواتف. رجاءً جرّب تفتح الموقع
      من جهاز كمبيوتر بالوقت الحالي.
    </p>
    <div class="badge">نرجع أحسن قريباً 🙏</div>
  </body>
</html>
